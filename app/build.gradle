import com.android.build.api.artifact.SingleArtifact
import com.fongmi.gradle.AbiApkPackaging

plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
rootProject.file('local.properties').withInputStream {
    localProps.load(it)
}

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    // 2026-10-25: 版本号改为从 version.properties 读（scripts/release.py 自动维护），
    // 构建标识（构建时间 + git 短 hash）注入 BuildConfig，设置页显示，便于确认装的哪一版。
    def versionProps = new Properties()
    def versionFile = rootProject.file("version.properties")
    if (versionFile.exists()) {
        versionFile.withInputStream { versionProps.load(it) }
    }
    def versionNameBase = versionProps.getProperty("VERSION_NAME", "5.6.1")
    def versionCodeBase = versionProps.getProperty("VERSION_CODE", "561").toInteger()
    def buildStamp = new Date().format("yyyy-MM-dd HH:mm")
    def gitHash = "nogit"
    try {
        def gitProc = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootProject.projectDir)
        gitProc.waitForOrKill(10000)
        if (gitProc.exitValue() == 0) gitHash = gitProc.text.trim()
    } catch (Exception ignored) {
    }

    // 2026-10-25: 版本文件要作为打包任务的输入 —— 否则改了 version.properties，
    // gradle 认为产物仍是最新，打出来的 APK 版本号不更新（发版脚本会拿到旧包）。
    afterEvaluate {
        tasks.matching { it.name ==~ /package.*|assemble.*|bundle.*/ }.configureEach {
            inputs.file(versionFile).withPropertyName("versionProperties").optional(true)
        }
    }

    defaultConfig {
        // 2026-10-09: overridable so a self-built APK can be installed side by side with
        // the official one for verification. This build is signed with a debug key, so
        // installing it under the real id would require uninstalling the official app
        // first and would wipe its history and favourites. The namespace above is
        // deliberately NOT changed: it is what resolves the com.fongmi.android.tv.*
        // class names used in the layouts and in generated R/Binding classes.
        applicationId project.findProperty('appId') ?: "com.fongmi.android.tv"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode versionCodeBase
        versionName versionNameBase
        buildConfigField "String", "BUILD_ID", "\"${buildStamp}\u00b7${gitHash}\""
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["device"]

    productFlavors {
        leanback {
            dimension "device"
        }
        mobile {
            dimension "device"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        release {
            storeFile file(localProps['storeFile'])
            keyAlias localProps['keyAlias']
            keyPassword localProps['storePassword']
            storePassword localProps['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

AbiApkPackaging.configure(project, SingleArtifact.APK.INSTANCE)

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.appcompat
    implementation libs.lifecycle.service
    implementation libs.media
    implementation libs.media.ui
    implementation libs.media.exoplayer.hls
    implementation libs.media.exoplayer.dash
    implementation libs.media.datasource.okhttp
    implementation libs.media.effect
    implementation libs.media.session
    leanbackImplementation libs.media.ui.leanback
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.rtmp.client
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable
    leanbackImplementation libs.leanback
    leanbackImplementation libs.androidautosize
    mobileImplementation libs.biometric
    mobileImplementation libs.zxing.android.embedded
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    coreLibraryDesugaring libs.desugar
}
